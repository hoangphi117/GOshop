services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/uploads:/var/www/uploads:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api1
      - api2
    networks:
      - goshop-network

  api1:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.prod
    container_name: goshop-api1
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - api
          - api1

  api2:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.prod
    container_name: goshop-api2
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - api
          - api2

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.dev
    container_name: goshop-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - goshop-network

  storefront:
    build:
      context: ./frontend
      dockerfile: Dockerfile.storefront
    container_name: goshop-storefront
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - goshop-network

  postgres:
    image: postgres:16-alpine
    container_name: goshop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150 -c shared_buffers=256MB -c work_mem=16MB
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super@password}
      POSTGRES_DB: ${DB_NAME:-shopping}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-shopping}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  redis:
    image: redis:alpine
    container_name: goshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: goshop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-goshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-goshop}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  certbot:
    image: certbot/certbot:latest
    container_name: goshop-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - goshop-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: goshop-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-masterKey123}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - goshop-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local
  certbot-www:
    driver: local
  meilisearch-data:
    driver: local

networks:
  goshop-network:
    driver: bridge


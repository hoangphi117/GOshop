        # Baked into the client bundle: same-origin absolute URL on port 80,
        # where nginx proxies /api/v1. NEVER a container-internal name here —
        # the browser must be able to use it directly.
        - NEXT_PUBLIC_API_URL=http://localhost
        # No API key baked here: nginx injects X-API-KEY at the edge.
    container_name: goshop-storefront
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Server components read INTERNAL_API_URL at runtime (api-server.ts
      # prefers it over NEXT_PUBLIC_API_URL). Reach the edge over the compose
      # network; the browser bundle is unaffected.
      - INTERNAL_API_URL=http://nginx
      - NEXT_PUBLIC_API_URL=http://nginx
    networks:
      - goshop-network

  # Admin SPA is NOT a container: the edge nginx serves the static Vite build
  # directly (volume ./frontend/apps/dashboard/dist â†’ /srv/dashboard above).
  # Build it with:  pnpm --filter dashboard build   (host or CI)

  postgres:
    image: postgres:16-alpine
    container_name: goshop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150 -c shared_buffers=256MB -c work_mem=16MB
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super@password}
      POSTGRES_DB: ${DB_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_USER:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  redis:
    image: redis:alpine
    container_name: goshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: goshop-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Topics come from kafka-init below, so a typo in a topic name fails
      # loudly instead of silently materialising an empty one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      CLUSTER_ID: goshop-prod-kafka-000000001
    volumes:
      # apache/kafka:3.9.0 stores logs in /tmp/kafka-logs, not
      # /var/lib/kafka/data — mounting the latter persisted nothing and every
      # broker restart came back with zero topics while consumers re-joined
      # empty groups (assigned partitions 0). Mount the real path.
      - kafka-data:/tmp/kafka-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - goshop-network

  kafka-init:
    # One-shot: creates the domain topics (plan §4.1) and their DLQ siblings
    # before any consumer starts. Mirrors docker-compose.dev.yml; AUTO_CREATE
    # is off so a wrong topic name fails here rather than at consume time.
    image: apache/kafka:3.9.0
    container_name: goshop-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.order.v1 --partitions 3 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.order-return.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.payment.v1 --partitions 3 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.user.v1 --partitions 3 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.email.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.inventory.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.review.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.notification.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.media.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.shipping.v1 --partitions 1 --replication-factor 1
        for d in order order-return payment user email inventory review notification media shipping; do
          $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.$$d.v1.dlq --partitions 1 --replication-factor 1
        done
        echo "kafka topics ready"
    networks:
      - goshop-network

  certbot:
    image: certbot/certbot:latest
    container_name: goshop-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - goshop-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: goshop-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-goshop-dev-master-key-32-chars-len}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - goshop-network

  minio:
    # Object storage only runs when asked for (local/offline dev):
    #   docker compose --profile minio ...
    # Prod reads .env instead — with STORAGE_DRIVER=r2 no MinIO container
    # is started at all (RAM + a volume saved).
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio:latest
    container_name: goshop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-goshop_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-goshop_secret_key}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - goshop-network

  promtail:
    # Ships container logs to Grafana Cloud Loki. No local Loki: the whole log
    # stack is one ~40MB agent, which keeps a small VPS viable.
    image: grafana/promtail:3.5.1
    container_name: goshop-promtail
    restart: unless-stopped
    # env vars are referenced from promtail-config.yml via ${...}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    env_file:
      - ./backend/.env
    volumes:
      - ./system/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Read-only socket: docker service discovery + container log tailing.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - goshop-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local
  certbot-www:
    driver: local
  meilisearch-data:
    driver: local
  minio-data:
    driver: local

networks:
  goshop-network:
    driver: bridge

# =============================================================================
# Shared JWT verifier config. Every service EXCEPT `identity` (the signer) must
# validate RS256 access tokens with the shared public key. If a verifier misses
# either the env vars or the certs mount, pkg/auth mints an EPHEMERAL key
# (backend/pkg/auth/jwt.go loadOrGenerateRSAKeys) and every authenticated
# request 401s. Use both entries together:
#   environment: { <<: *jwt-verifier, <service-specific vars> }
#   volumes: *jwt-certs
# =============================================================================
x-jwt-verifier: &jwt-verifier
  JWT_SIGNING_ENABLED: "false"
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: /app/certs/jwt_public.pem
  # backend/.env ships DB_HOST=localhost for host-side runs (make dev-host).
  # Compose services must override it to reach the postgres service.
  DB_HOST: "postgres"

x-jwt-certs: &jwt-certs
  - ./backend/certs:/app/certs:ro

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # API_KEY reaches nginx only through envsubst at container start (nginx
    # cannot merge env into config natively). Rendered into /etc/nginx/secret-conf.
    environment:
      - API_KEY=${API_KEY:?API_KEY must be set (edge injects it server-side)}
      # envsubst renders ${MEILISEARCH_MASTER_KEY} into the /search-api/ map;
      # without it nginx exits on "unknown variable" and restart-loops.
      - MEILISEARCH_MASTER_KEY=${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY must be set (edge injects it for /search-api)}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/secret-conf
    volumes:
      # tmpfs: the rendered secret never touches any layer or volume.
      - type: tmpfs
        target: /etc/nginx/secret-conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/prod/goshop.conf:/etc/nginx/conf.d/goshop.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      # Self-signed localhost cert (scripts/gen-cert.ps1). Recreate/regenerate
      # for a real domain instead of trusting this one.
      - ./nginx/certs:/etc/nginx/ssl:ro
      # Admin dashboard SPA — static build from the host (or CI artifact).
      # Rebuild with: pnpm --filter dashboard build
      - ./frontend/apps/dashboard/dist:/srv/dashboard:ro
    # /admin/ uses `root` (not `alias`) so try_files can fall back to
    # /admin/index.html for client-side routes; give the URI path a symlink.
    tmpfs:
      - /srv/root
    entrypoint: ["/bin/sh", "-c", "ln -sfn /srv/dashboard /srv/root/admin && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on:
      - api1
      - api2
      - identity
      - ws-gateway
    networks:
      - goshop-network

  api1:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service
      args:
        SERVICE: api
    container_name: goshop-api1
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      <<: *jwt-verifier
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      MEILISEARCH_HOST: "http://meilisearch:7700"
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      IDENTITY_GRPC_ADDR: "identity-service:50051"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8082"
      PAYMENT_SERVICE_URL: "http://payment-service:8083"
      PAYMENT_GRPC_ADDR: "payment-service:50052"
      ORDER_SERVICE_URL: "http://order-service:8088"
      ORDER_GRPC_TARGET: "order-service:50057"
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in production}"
      REVIEW_SERVICE_URL: "http://review-service:8091"
      ANALYTICS_SERVICE_URL: "http://analytics-service:8092"
      MEDIA_SERVICE_URL: "http://media-service:8094"
      CHAT_SERVICE_URL: "http://chat-service:8093"
      CART_SERVICE_URL: "http://cart-service:8087"
      CART_GRPC_ADDR: "cart-service:50056"
      CATALOG_SERVICE_URL: "http://catalog-service:8086"
      CATALOG_GRPC_TARGET: "catalog-service:50055"
      COUPON_SERVICE_URL: "http://coupon-service:8084"
      COUPON_GRPC_TARGET: "coupon-service:50053"
      INVENTORY_SERVICE_URL: "http://inventory-service:8090"
      INVENTORY_GRPC_ADDR: "inventory-service:50054"
      BANNER_SERVICE_URL: "http://banner-service:8089"
      CHAT_GRPC_TARGET: "chat-service:50058"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes: *jwt-certs
    networks:
      goshop-network:
        aliases:
          - api
          - api1


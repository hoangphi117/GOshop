    volumes: *jwt-certs
    networks:
      - goshop-network

  storefront:
    build:
      context: ./frontend
      dockerfile: Dockerfile.storefront
      args:
        # Baked into the client bundle: same-origin absolute URL on port 80,
        # where nginx proxies /api/v1. NEVER a container-internal name here —
        # the browser must be able to use it directly.
        - NEXT_PUBLIC_API_URL=http://localhost
        - NEXT_PUBLIC_API_KEY=${API_KEY:?API_KEY must be set (storefront bundles it)}
    container_name: goshop-storefront
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Server components read INTERNAL_API_URL at runtime (api-server.ts
      # prefers it over NEXT_PUBLIC_API_URL). Reach the edge over the compose
      # network; the browser bundle is unaffected.
      - INTERNAL_API_URL=http://nginx
      - NEXT_PUBLIC_API_URL=http://nginx
    networks:
      - goshop-network

  # Admin SPA is NOT a container: the edge nginx serves the static Vite build
  # directly (volume ./frontend/apps/dashboard/dist → /srv/dashboard above).
  # Build it with:  pnpm --filter dashboard build   (host or CI)

  postgres:
    image: postgres:16-alpine
    container_name: goshop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150 -c shared_buffers=256MB -c work_mem=16MB
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super@password}
      POSTGRES_DB: ${DB_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_USER:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  redis:
    image: redis:alpine
    container_name: goshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: goshop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-goshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-goshop}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  certbot:
    image: certbot/certbot:latest
    container_name: goshop-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - goshop-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: goshop-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-goshop-dev-master-key-32-chars-len}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - goshop-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: goshop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-goshop_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-goshop_secret_key}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - goshop-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local
  certbot-www:
    driver: local
  meilisearch-data:
    driver: local
  minio-data:
    driver: local

networks:
  goshop-network:
    driver: bridge

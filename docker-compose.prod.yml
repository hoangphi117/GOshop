  order:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service
      args:
        SERVICE: order
    container_name: goshop-order
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "50057:50057"
    env_file:
      - ./backend/.env
    environment:
      <<: *jwt-verifier
      DB_HOST: "postgres"
      DB_NAME: "shopping_order"
      ORDER_DB_NAME: "shopping_order"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:29096"
      KAFKA_SASL_USER: "order"
      KAFKA_SASL_PASSWORD: "${KAFKA_SASL_ORDER_PASSWORD:?KAFKA_SASL_ORDER_PASSWORD must be set in production}"
      ORDER_SERVER_PORT: "8088"
      ORDER_GRPC_PORT: "50057"
      CATALOG_GRPC_ADDR: "${CATALOG_GRPC_ADDR:-catalog-service:50055}"
      INVENTORY_GRPC_ADDR: "${INVENTORY_GRPC_ADDR:-inventory-service:50054}"
      COUPON_GRPC_ADDR: "${COUPON_GRPC_ADDR:-coupon-service:50053}"
      CART_GRPC_ADDR: "${CART_GRPC_ADDR:-cart-service:50056}"
      IDENTITY_GRPC_ADDR: "identity-service:50051"
      PAYMENT_GRPC_ADDR: "payment-service:50052"
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      coupon:
        condition: service_started
      cart:
        condition: service_started
      identity:
        condition: service_started
      payment:
        condition: service_started
    volumes: *jwt-certs
    networks:
      goshop-network:
        aliases:
          - order-service

  worker:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service
      args:
        SERVICE: worker
    container_name: goshop-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      <<: *jwt-verifier
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:29096"
      KAFKA_SASL_USER: "worker"
      KAFKA_SASL_PASSWORD: "${KAFKA_SASL_WORKER_PASSWORD:?KAFKA_SASL_WORKER_PASSWORD must be set in production}"
      MEILISEARCH_HOST: "http://meilisearch:7700"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes: *jwt-certs
    networks:
      - goshop-network

  ws-gateway:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service
      args:
        SERVICE: ws-gateway
    container_name: goshop-ws-gateway
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      <<: *jwt-verifier
      REDIS_ADDR: "redis:6379"
      WS_GATEWAY_PORT: "8085"
      APP_ENV: "production"
      IDENTITY_GRPC_ADDR: "identity-service:50051"
      CHAT_GRPC_TARGET: "chat-service:50058"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chat:
        condition: service_started
    volumes: *jwt-certs
    networks:
      - goshop-network

  storefront:
    build:
      context: ./frontend
      dockerfile: Dockerfile.storefront
      args:
        # Baked into the client bundle: same-origin absolute URL on port 80,
        # where nginx proxies /api/v1. NEVER a container-internal name here —
        # the browser must be able to use it directly.
        - NEXT_PUBLIC_API_URL=http://localhost
        # No API key baked here: nginx injects X-API-KEY at the edge.
    container_name: goshop-storefront
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Server components read INTERNAL_API_URL at runtime (api-server.ts
      # prefers it over NEXT_PUBLIC_API_URL). Reach the edge over the compose
      # network; the browser bundle is unaffected.
      - INTERNAL_API_URL=http://nginx
      - NEXT_PUBLIC_API_URL=http://nginx
    networks:
      - goshop-network

  # Admin SPA is NOT a container: the edge nginx serves the static Vite build
  # directly (volume ./frontend/apps/dashboard/dist â†’ /srv/dashboard above).
  # Build it with:  pnpm --filter dashboard build   (host or CI)

  postgres:
    image: postgres:16-alpine
    container_name: goshop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150 -c shared_buffers=256MB -c work_mem=16MB
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super@password}
      POSTGRES_DB: ${DB_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_USER:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  redis:
    image: redis:alpine
    container_name: goshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: goshop-kafka
    restart: unless-stopped
    # kafka-sasl-users.sh and kafka-acl-verify.sh read KAFKA_SASL_*_PASSWORDs
    # from this container's environment. Without env_file those come only from
    # the `make` process, i.e. from an interactive shell, and the verification
    # silently reports "no password" instead of running.
    env_file:
      - ./backend/.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: SASL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,BOOTSTRAP://0.0.0.0:29093,SSL://0.0.0.0:29095,SASL_SSL://0.0.0.0:29096
      # Clients use SASL_SSL (29096): SCRAM identity over TLS. SASL (29092) is
      # kept for the pre-TLS clients still deployed; plain SSL (29095) has no
      # SASL at all, so a client configured with KAFKA_SASL_USER must NOT point
      # there - the broker answers `Unexpected handshake request`.
      KAFKA_ADVERTISED_LISTENERS: SASL://kafka:29092,SSL://kafka:29095,SASL_SSL://kafka:29096,CONTROLLER://kafka:9093,BOOTSTRAP://kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Inter-broker stays on the bootstrap listener: the broker has to be
      # able to reach itself before any SCRAM credential exists.
      KAFKA_INTER_BROKER_LISTENER_NAME: BOOTSTRAP
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      # Controller and broker both talk to the CONTROLLER listener as
      # User:ANONYMOUS (PLAINTEXT). With the authorizer denying by default that
      # registration is rejected, so ANONYMOUS has to be a super user; it cannot
      # be narrowed to a named principal without putting SASL on CONTROLLER.
      KAFKA_SUPER_USERS: "User:${KAFKA_SASL_ADMIN_USER:-admin};User:broker;User:ANONYMOUS"
      # A SASL listener refuses to start without a JAAS entry, even when the
      # inter-broker listener is plaintext. KafkaServer (not broker) is the
      # name JaasContext looks for; the file is not a secret because the
      # broker only ever authenticates to itself.
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL:SASL_PLAINTEXT,BOOTSTRAP:PLAINTEXT,SSL:SSL,SASL_SSL:SASL_SSL
      # TLS (phase 6 item 3). The keystore and truststore are JKS generated by
      # scripts/gen-kafka-tls-certs.ps1 and bind-mounted read-only below; only
      # the password travels in the environment.
      # PEM is not an option: Kafka 3.9's PemParser rejects both multi-line
      # bodies and PKCS#1 keys, so no openssl-produced PEM loads.
      #
      # The image's /etc/kafka/docker/configure derives LOCATION itself and
      # reads the passwords from credential FILES (key.creds/store.creds).
      # Setting KAFKA_SSL_KEYSTORE_LOCATION or KAFKA_SSL_KEY_PASSWORD here makes
      # it skip that derivation and die with `line 18: !1: unbound variable`.
      KAFKA_SSL_KEYSTORE_TYPE: JKS
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.jks
      KAFKA_SSL_KEY_CREDENTIALS: key.creds
      KAFKA_SSL_KEYSTORE_CREDENTIALS: store.creds
      KAFKA_SSL_TRUSTSTORE_TYPE: JKS
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/tls/kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:?run make kafka-env}
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_SSL_ENABLED_PROTOCOLS: TLSv1.2,TLSv1.3
      # ACL (phase 6 item 4). StandardAuthorizer ships with the broker; no extra
      # jar. Scripts/kafka-acls.sh must run once against a fresh volume before
      # the services start, otherwise every client is denied: this is the closed
      # default, and the bootstrap listener is PLAINTEXT so the script still has
      # a way in.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Topics come from kafka-init below, so a typo in a topic name fails
      # loudly instead of silently materialising an empty one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      CLUSTER_ID: goshop-prod-kafka-000000001
    volumes:
      # apache/kafka:3.9.0 stores logs in /tmp/kafka-logs, not
      # /var/lib/kafka/data — mounting the latter persisted nothing and every
      # broker restart came back with zero topics while consumers re-joined
      # empty groups (assigned partitions 0). Mount the real path.
      - kafka-data:/tmp/kafka-logs
      # Bootstraps SCRAM users on a fresh volume (`make kafka-sasl-users`) and
      # grants their ACLs (`make kafka-acls`).
      - ./scripts/kafka-sasl-users.sh:/tmp/kafka-sasl-users.sh:ro
      - ./scripts/kafka-acls.sh:/tmp/kafka-acls.sh:ro
      - ./scripts/kafka-acl-verify.sh:/tmp/kafka-acl-verify.sh:ro
      - ./backend/kafka/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
      # JKS files, not secrets: the keystore password is in backend/.env.
      # Mounted TWICE on purpose: /etc/kafka/secrets is where the image looks
      # up the keystore by filename and reads key.creds/store.creds;
      # /etc/kafka/tls is the path KAFKA_TLS_CA_FILE and the Go clients use.
      - ./backend/kafka/tls:/etc/kafka/secrets:ro
      - ./backend/kafka/tls:/etc/kafka/tls:ro
    ports:
      # Loopback only: the bootstrap listener is unauthenticated by design, so
      # it must never be reachable from outside the host. Used once per fresh
      # volume by `make kafka-sasl-users`. The advertised name stays `kafka`
      # so the kafka-init service and the bootstrap script agree on it;
      # on the host, kafka:29093 is not resolvable, which is the point.
      - "127.0.0.1:29094:29093"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29093",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - goshop-network

  kafka-init:
    # One-shot: creates the domain topics (plan §4.1) and their DLQ siblings
    # before any consumer starts. Mirrors docker-compose.dev.yml; AUTO_CREATE
    # is off so a wrong topic name fails here rather than at consume time.
    image: apache/kafka:3.9.0
    container_name: goshop-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29093
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.order.v1 --partitions 3 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.order-return.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.payment.v1 --partitions 3 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.user.v1 --partitions 3 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.email.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.inventory.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.review.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.notification.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.media.v1 --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic goshop.shipping.v1 --partitions 1 --replication-factor 1
        for d in order order-return payment user email inventory review notification media shipping; do
          $$K --bootstrap-server $$B --create --if-not-exists --topic "goshop.$${d}.v1.dlq" --partitions 1 --replication-factor 1
          # Phase 3: a dead letter is only useful if it is still there when an
          # operator investigates, so DLQ topics keep records forever. Domain
          # topics keep the broker default.
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server $$B --alter --entity-type topics --entity-name "goshop.$${d}.v1.dlq" --add-config retention.ms=-1 || true
        done
        echo "kafka topics ready"
    networks:
      - goshop-network

  certbot:
    image: certbot/certbot:latest
    container_name: goshop-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - goshop-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: goshop-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-goshop-dev-master-key-32-chars-len}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - goshop-network

  minio:
    # Object storage only runs when asked for (local/offline dev):
    #   docker compose --profile minio ...
    # Prod reads .env instead — with STORAGE_DRIVER=r2 no MinIO container
    # is started at all (RAM + a volume saved).
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio:latest
    container_name: goshop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-goshop_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-goshop_secret_key}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - goshop-network

  kafka-exporter:
    # Phase 1 observability: broker-side lag/throughput/under-replicated
    # metrics on :9308/metrics. Prometheus (or Grafana Cloud) scrapes it;
    # the adapter's own counters ride /healthz as messaging_lag + counters.
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: goshop-kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:29092
      - --web.listen-address=:9308
      - --sasl.enabled
      - --sasl.mechanism=scram-sha512
      - --sasl.username=${KAFKA_SASL_ADMIN_USER:-admin}
      - --sasl.password=${KAFKA_SASL_ADMIN_PASSWORD:?KAFKA_SASL_ADMIN_PASSWORD must be set in production}
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - goshop-network

  promtail:
    # Ships container logs to Grafana Cloud Loki. No local Loki: the whole log
    # stack is one ~40MB agent, which keeps a small VPS viable.
    image: grafana/promtail:3.5.1
    container_name: goshop-promtail
    restart: unless-stopped
    # env vars are referenced from promtail-config.yml via ${...}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    env_file:
      - ./backend/.env
    volumes:
      - ./system/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Read-only socket: docker service discovery + container log tailing.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - goshop-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local
  certbot-www:
    driver: local
  meilisearch-data:
    driver: local
  minio-data:
    driver: local

networks:
  goshop-network:
    driver: bridge

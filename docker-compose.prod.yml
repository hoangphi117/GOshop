services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api1
      - api2
      - identity
      - ws-gateway
    networks:
      - goshop-network

  api1:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.prod
    container_name: goshop-api1
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - NOTIFICATION_SERVICE_URL=http://notification-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8083
      - PAYMENT_GRPC_ADDR=payment-service:50052
      - ORDER_SERVICE_URL=http://order-service:8088
      - ORDER_GRPC_TARGET=order-service:50057
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in production}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - api
          - api1

  api2:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.prod
    container_name: goshop-api2
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - NOTIFICATION_SERVICE_URL=http://notification-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8083
      - PAYMENT_GRPC_ADDR=payment-service:50052
      - ORDER_SERVICE_URL=http://order-service:8088
      - ORDER_GRPC_TARGET=order-service:50057
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in production}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - api
          - api2

  identity:
    build:
      context: ./backend
      dockerfile: Dockerfile.identity.prod
    container_name: goshop-identity
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping_identity
      - IDENTITY_DB_NAME=shopping_identity
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
      - IDENTITY_SERVER_PORT=8081
      - IDENTITY_GRPC_PORT=:50051
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in production}
      - JWT_SIGNING_ENABLED=true
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set in production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - identity-service

  notification:
    build:
      context: ./backend
      dockerfile: Dockerfile.notification.prod
    container_name: goshop-notification
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - NOTIFICATION_SERVER_PORT=8082
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in production}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - notification-service

  payment:
    build:
      context: ./backend
      dockerfile: Dockerfile.payment.prod
    container_name: goshop-payment
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "50052:50052"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping_payment
      - PAYMENT_DB_NAME=shopping_payment
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - PAYMENT_SERVER_PORT=8083
      - PAYMENT_GRPC_PORT=50052
      - ORDER_GRPC_ADDR=order-service:50057
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in production}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - payment-service

  catalog:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.prod
      args:
        SERVICE: catalog
    container_name: goshop-catalog
    restart: unless-stopped
    ports:
      - "8086:8086"
      - "50055:50055"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping_catalog
      - CATALOG_DB_NAME=shopping_catalog
      - CATALOG_SERVER_PORT=8086
      - CATALOG_GRPC_PORT=50055
      - JWT_PRIVATE_KEY=
      - INVENTORY_GRPC_ADDR=inventory-service:50054
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
      - GOMEMLIMIT=128MiB
      - GOMAXPROCS=1
    mem_limit: 160m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_started
      inventory:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - catalog-service

  inventory:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.prod
      args:
        SERVICE: inventory
    container_name: goshop-inventory
    restart: unless-stopped
    ports:
      - "8085:8085"
      - "50054:50054"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping_inventory
      - INVENTORY_DB_NAME=shopping_inventory
      - INVENTORY_SERVER_PORT=8085
      - INVENTORY_GRPC_PORT=50054
      - JWT_PRIVATE_KEY=
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - GOMEMLIMIT=128MiB
      - GOMAXPROCS=1
    mem_limit: 160m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - inventory-service

  coupon:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.prod
      args:
        SERVICE: coupon
    container_name: goshop-coupon
    restart: unless-stopped
    ports:
      - "8084:8084"
      - "50053:50053"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping_coupon
      - COUPON_DB_NAME=shopping_coupon
      - COUPON_SERVER_PORT=8084
      - COUPON_GRPC_PORT=50053
      - JWT_PRIVATE_KEY=
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - GOMEMLIMIT=96MiB
      - GOMAXPROCS=1
    mem_limit: 128m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - coupon-service

  cart:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.prod
      args:
        SERVICE: cart
    container_name: goshop-cart
    restart: unless-stopped
    ports:
      - "8087:8087"
      - "50056:50056"
    env_file:
      - ./backend/.env
    environment:
      - DB_NAME=shopping_cart
      - CART_DB_NAME=shopping_cart
      - CART_SERVER_PORT=8087
      - CART_GRPC_PORT=50056
      - CATALOG_GRPC_ADDR=catalog-service:50055
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - GOMEMLIMIT=128MiB
      - GOMAXPROCS=1
    mem_limit: 160m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - cart-service

  order:
    build:
      context: ./backend
      dockerfile: Dockerfile.order.prod
    container_name: goshop-order
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "50057:50057"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping_order
      - ORDER_DB_NAME=shopping_order
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - ORDER_SERVER_PORT=8088
      - ORDER_GRPC_PORT=50057
      - CATALOG_GRPC_ADDR=${CATALOG_GRPC_ADDR:-catalog-service:50055}
      - INVENTORY_GRPC_ADDR=${INVENTORY_GRPC_ADDR:-inventory-service:50054}
      - COUPON_GRPC_ADDR=${COUPON_GRPC_ADDR:-coupon-service:50053}
      - CART_GRPC_ADDR=${CART_GRPC_ADDR:-cart-service:50056}
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - PAYMENT_GRPC_ADDR=payment-service:50052
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in production}
      - JWT_SIGNING_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      coupon:
        condition: service_started
      cart:
        condition: service_started
      identity:
        condition: service_started
      payment:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - order-service

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.prod
    container_name: goshop-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - goshop-network

  ws-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.ws-gateway.prod
    container_name: goshop-ws-gateway
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping
      - REDIS_ADDR=redis:6379
      - WS_GATEWAY_PORT=8085
      - APP_ENV=production
      - JWT_SIGNING_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - goshop-network

  storefront:
    build:
      context: ./frontend
      dockerfile: Dockerfile.storefront
    container_name: goshop-storefront
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - goshop-network

  postgres:
    image: postgres:16-alpine
    container_name: goshop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150 -c shared_buffers=256MB -c work_mem=16MB
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super@password}
      POSTGRES_DB: ${DB_NAME:-shopping}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-shopping}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  redis:
    image: redis:alpine
    container_name: goshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: goshop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-goshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-goshop}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  certbot:
    image: certbot/certbot:latest
    container_name: goshop-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - goshop-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: goshop-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-masterKey123}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - goshop-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: goshop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-goshop_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-goshop_secret_key}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - goshop-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local
  certbot-www:
    driver: local
  meilisearch-data:
    driver: local
  minio-data:
    driver: local

networks:
  goshop-network:
    driver: bridge

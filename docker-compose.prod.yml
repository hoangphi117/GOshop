      - MEILISEARCH_HOST=http://meilisearch:7700
      - IDENTITY_SERVER_PORT=8081
      - IDENTITY_GRPC_PORT=:50051
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in production}
      - JWT_SIGNING_ENABLED=true
      # Value is either an inline PEM or a path (pkg/auth.loadKeyData accepts

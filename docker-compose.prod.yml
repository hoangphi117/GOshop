      context: ./backend
      dockerfile: Dockerfile.ws-gateway.prod
    container_name: goshop-ws-gateway
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      <<: *jwt-verifier
      REDIS_ADDR: "redis:6379"
      WS_GATEWAY_PORT: "8085"
      APP_ENV: "production"
      IDENTITY_GRPC_ADDR: "identity-service:50051"
      CHAT_GRPC_TARGET: "chat-service:50058"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chat:

// Kafka broker JAAS config (mounted read-only into goshop-kafka).
//
// A SASL listener will not start without a KafkaServer entry, even when the
// inter-broker listener is plaintext: pkg/kafka's services authenticate, and
// the broker needs this block to build the SASL channel.
//
// The credential here is the broker's own — it logs into its own SASL listener
// for inter-broker traffic. It is not a service credential and is not used by
// any Go process, so a static non-secret value is fine. Rotate it in lockstep
// with the SCRAM user created by scripts/kafka-sasl-users.sh:
//   docker exec goshop-kafka /tmp/kafka-sasl-users.sh 29093
// (PROD MUST NOT be reachable from outside the host on port 29094, where the
// unauthenticated bootstrap listener lives.)

KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="broker"
    password="broker-internal";
};

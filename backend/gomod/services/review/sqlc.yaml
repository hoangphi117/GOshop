version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/db/queries"
    schema: "./internal/migrations"
    gen:
      go:
        package: "sqlc"
        out: "./internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "text"
            go_type: "string"
          - db_type: "varchar"
            go_type: "string"
          - db_type: "varchar"
            go_type: "string"
            nullable: true
          - db_type: "char"
            go_type: "string"
          - db_type: "bool"
            go_type: "bool"
          - db_type: "int2"
            go_type: "int16"
          - db_type: "int2"
            go_type: "int16"
            nullable: true
          - db_type: "int4"
            go_type: "int32"
          - db_type: "int4"
            go_type: "int32"
            nullable: true
          - db_type: "int8"
            go_type: "int64"
          - db_type: "int8"
            go_type: "int64"
            nullable: true
          - db_type: "serial"
            go_type: "int32"
          - db_type: "bigserial"
            go_type: "int64"
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

syntax = "proto3";

// Envelope fields injected by contracts/events.EnrichEventPayload.
//
// IMPORTANT: this envelope is NOT present on every topic. Only producers that
// call EnrichEventPayload (the order outbox) get these keys, and each key is
// written only when the payload does not already carry it. Payment, review,
// identity and media publish their payload straight to the broker and carry
// none of these fields.
//
// event_version is the version of this envelope, not of the payload message.
// Bump it only when the envelope shape changes.
package events.common.v1;

option go_package = "goshop/shared/proto/events/common/v1;commonv1";

message EventEnvelope {
  // UUID generated by EnrichEventPayload when the payload has none.
  // Topics whose payload structs already carry event_id keep the struct value.
  string event_id = 1;

  // Envelope version. Currently 1 (contracts/events.CurrentEventVersion).
  int32 event_version = 2;

  // W3C trace id propagated from the publishing request context.
  string trace_id = 3;

  // RFC3339Nano string. Distinct from the payload's own `timestamp` field,
  // which is a JSON time.Time and may name a different instant.
  string occurred_at = 4;

  // Coarse event family, e.g. "order", "inventory". Not the routing key.
  string event_type = 5;

  // Id of the aggregate that produced the event.
  string aggregate_id = 6;
}

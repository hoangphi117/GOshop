version: "2"

run:
  timeout: 5m
  tests: true

# The module split (go.work) makes cross-module edges a compile error, so
# depguard only has to police edges that are legal to write but wrong by
# design. Paths in `files` are relative to the backend directory, where the
# linter runs.
linters:
  enable:
    - depguard
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        shared_does_not_depend_on_services:
          list-mode: lax
          files:
            - "gomod/shared/**/*.go"
          deny:
            - pkg: "goshop/services"
              desc: "Shared code must not import a service; dependencies flow one way"
            - pkg: "goshop/cmd"
              desc: "Shared code must not import a command"
        contracts_are_leaf:
          list-mode: lax
          files:
            - "gomod/contracts/**/*.go"
          deny:
            - pkg: "goshop/services"
              desc: "Event contracts must not import services"
            - pkg: "goshop/cmd"
              desc: "Event contracts must not import commands"
        services_do_not_import_commands:
          list-mode: lax
          files:
            - "gomod/services/**/*.go"
            - "!$**/*_test.go"
          deny:
            - pkg: "goshop/cmd"
              desc: "Services must not import a command; wire the other way around"

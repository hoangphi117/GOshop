paths:
  /addresses:
    get:
      description: Retrieve all shipping addresses belonging to the authenticated
        user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/goshop_pkg_utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AddressDTO'
                  type: array
              type: object
        "401":

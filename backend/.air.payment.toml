# Working directory
root = "."
tmp_dir = "tmp"

[build]
    cmd = "go build -o ./tmp/payment ./cmd/payment"
    bin = "tmp/payment"
    include_ext = ["go", "yaml", "yml", "env"]
    exclude_dir = ["assets", "tmp", "vendor", "frontend/node_modules", "bin", ".git", "uploads"]
    exclude_file = []
    exclude_regex = ["_test.go"]
    delay = 1000
    send_interrupt = true
    kill_delay = 500
    poll = true
    poll_interval = 500
    log = "payment_build.log"

[log]
    time = true

[color]
    main = "blue"
    watcher = "cyan"
    build = "yellow"
    runner = "green"

[misc]
    clean_on_exit = true

syntax = "proto3";

package order.v1;

option go_package = "goshop/proto/order/v1;orderv1";

message OrderItemSummary {
  string product_uuid = 1;
  string product_name = 2;
  int32 quantity = 3;
  double price = 4;
}

message OrderSummaryDTO {
  int32 order_id = 1;
  string order_uuid = 2;
  string order_number = 3;
  int32 user_id = 4;
  string user_uuid = 5;
  string customer_name = 6;
  string customer_email = 7;
  int32 status = 8;
  double total_amount = 9;
  string delivered_at = 10;
  string updated_at = 11;
  repeated OrderItemSummary items = 12;
}

message GetOrderSummaryRequest {
  string order_uuid = 1;
}

message GetOrderSummaryResponse {
  OrderSummaryDTO order = 1;
}

message VerifyPurchaseRequest {
  string order_uuid = 1;
  int32 user_id = 2;
  string user_uuid = 3;
  int32 product_id = 4;
  string product_uuid = 5;
}

message VerifyPurchaseResponse {
  int32 order_id = 1;
  string order_uuid = 2;
  int32 user_id = 3;
  bool is_purchased = 4;
  bool can_review = 5;
  string delivered_at = 6;
  string customer_name = 7;
  string customer_email = 8;
  string shipping_name = 9;
}

message GetOrderForPaymentRequest {
  string order_uuid = 1;
}

message GetOrderForPaymentResponse {
  string order_uuid = 1;
  int32 user_id = 2;
  string user_uuid = 3;
  double total_amount = 4;
  int32 status = 5;
}

service OrderService {
  rpc GetOrderSummary(GetOrderSummaryRequest) returns (GetOrderSummaryResponse);
  rpc VerifyPurchase(VerifyPurchaseRequest) returns (VerifyPurchaseResponse);
  rpc GetOrderForPayment(GetOrderForPaymentRequest) returns (GetOrderForPaymentResponse);
}

# One-container backend on a plain VPS, alongside managed services.
#
# This is the VPS sibling of deploy/render/Dockerfile.all: the same image, the
# same 17 processes, the same start.sh. Postgres stays on Supabase, Kafka on
# Redpanda Cloud, Meilisearch on Meilisearch Cloud. Redis runs here as a local
# container: Render Key Value free refuses external traffic and its internal
# hostname does not resolve outside Render's network.
#
# Why not docker-compose.prod.yml: that file declares 3072 MB of mem_limit
# (1536 of it the torch embedder) and its own Kafka/Redis/Meilisearch/Prometheus.
# It needs ~4 GB. This one fits ~1.5-1.6 GB: the embedder here is the ONNX
# sidecar (docker/embedder), a few hundred MB, not the ~800 MB torch runtime.
#
# Usage on the VPS:
#   docker compose -f deploy/vps/docker-compose.vps.yml up -d --build
#
# Caddy terminates TLS and forwards everything to :8080. There is no second
# nginx: the image has no nginx, and Caddy is one 30 MB process instead.

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/render/Dockerfile.all
    image: goshop-backend:local
    container_name: goshop-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      # start.sh pins every listener to the compose ports; the gateway reads
      # PORT. Nothing here may bind outside the container except the gateway.
      PORT: "8080"
      # The switch the code reads is SKIP_MIGRATIONS
      # (shared/config/config.go:262). start.sh only translates the older
      # RUN_MIGRATIONS=false into it, so setting SKIP_MIGRATIONS directly is the
      # one knob that cannot be short-circuited by the entrypoint.
      SKIP_MIGRATIONS: "${SKIP_MIGRATIONS:-false}"
      # Overrides REDIS_ADDR from .env, which still points at Render's internal
      # hostname. The compose service name is the DNS entry inside `goshop`.
      # TLS stays off: this is a same-host TCP connection, not Render's public
      # endpoint, so REDIS_TLS_ENABLED must not be set.
      REDIS_ADDR: "redis:6379"
      # Turns on the semantic and personalized recommendation tiers. The sidecar
      # is a plain HTTP URL; without it recommendations falls back to
      # best-sellers and keyword-only search (docs/DEPLOY-VPS.md).
      EMBEDDER_URL: "http://embedder:8096"
    depends_on:
      # Start the backend only once the sidecar answers, so the first search
      # does not race the container's own start. The model loads on first use
      # (see app.py), so this is a process-up check, not a warm-model one.
      embedder:
        condition: service_healthy
    # Per-process cap. 17 processes x 96 MiB of Go heap should stay under
    # 1.6 GB worst case; the soft cap lets the runtime survive a spike rather
    # than be OOM-killed outright.
    mem_limit: 1600m
    cpus: 1.0
    expose:
      - "8080"
    healthcheck:
      # /healthz is served by the gateway. "storage":"skipped" is expected:
      # there is no local object store to probe.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - goshop

  # Sentence embeddings for the recommendation vectors. ONNX runtime, not torch:
  # the model is 22M parameters, so the ~800 MB torch runtime was almost all
  # overhead on this 1.9 GB host. mem_limit has to be small enough to leave the
  # backend room; the healthcheck the image ships with is what `depends_on` reads.
  embedder:
    build:
      # The Dockerfile COPYs docker/embedder/*, so the context is the repo root,
      # three levels up from this file (deploy/vps -> deploy -> backend -> root).
      context: ../../..
      dockerfile: docker/embedder/Dockerfile
    image: goshop-embedder:local
    container_name: goshop-embedder
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      EMBEDDING_THREADS: "1"
    mem_limit: 512m
    cpus: 1.0
    # No published port: only the backend reaches it, over the compose network.
    # Publishing 8096 would expose an unauthenticated compute route.
    expose:
      - "8096"
    networks:
      - goshop

  caddy:
    image: caddy:2-alpine
    container_name: goshop-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin Certificate, generated in the dashboard. Not tracked:
      # it is a private key, and the identity is per-zone.
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - goshop

  # Replaces Render Key Value. No host port: only the backend reaches it, over
  # the compose network. 256 MB cap keeps the whole VM inside 2 GB even when the
  # cache is cold-filling.
  redis:
    image: redis:7-alpine
    container_name: goshop-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    mem_limit: 320m
    healthcheck:
      # $$ escapes so the shell inside the container expands the password at
      # check time; compose must not interpolate it.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}"
    networks:
      - goshop

volumes:
  caddy-data:
  caddy-config:
  redis-data:

networks:
  goshop:
    driver: bridge

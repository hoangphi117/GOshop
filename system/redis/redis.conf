# Limit the maximum memory usage of Redis.
maxmemory 256mb

# Least Recently Used (LRU): Redis will try to remove the keys that have the least Time-To-Live (TTL, seconds) 
# and least recently used among the keys.
maxmemory-policy volatile-lru

# Enable persistence (RDB) to store the data on disk.

# Save the DB if at least (second parameter) key changed in (first parameter) seconds
save 900 1 
save 300 10 
save 60 10000

dir /data
# Prometheus for the GOshop compose project.
#
# Scrape model: docker service discovery, not a static list. Any container whose
# name matches the `keep` regex below is picked up automatically and labelled
# with its compose service name.
#
# How the /metrics port is found: every HTTP service mounts /metrics on its gin
# router, and each listens on its own port (8084..8094). Docker SD reports the
# exposed ports; the gRPC ports (50053..50058) are dropped and the remaining one
# is scraped.
#
# /metrics is unauthenticated. nginx only proxies explicit paths and does not
# proxy /metrics, so the endpoint stays reachable from the compose network only.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: goshop

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Broker-side truth: consumer group lag, under-replicated partitions,
  # throughput. Produces kafka_consumergroup_lag{consumergroup,topic}.
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # alertmanager is optional in dev (it only matters once there are rules to
  # fire), so it is scraped by name rather than discovered: an absent container
  # then reports down instead of vanishing.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Every Go service with a gin router (api, order, payment, ...). worker and
  # ws-gateway are excluded: neither mounts /metrics on an HTTP router, so a
  # target for them would be permanently down.
  #
  # Selection is by container name, not by published port: the compose files
  # publish only the few ports the edge needs, and a port-based rule would also
  # sweep up postgres/redis/certbot. Container name is `goshop-<service>` for
  # every composite (api1, order, ...), so one regex covers them.
  # ADD NEW SERVICES TO THE `keep` REGEX BELOW or they are silently unscraped.
  - job_name: goshop-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # api1/api2 share a compose service name, so instance is taken from the
      # container name (goshop-api1 → api1) to keep them distinct.
      - source_labels: [__meta_docker_container_name]
        regex: "/goshop-(.+)"
        target_label: instance
      - source_labels: [__meta_docker_container_name]
        regex: "/goshop-(api|identity|notification|payment|catalog|inventory|coupon|cart|banner|review|order|analytics|chat|media)(-[0-9]+)?"
        action: keep
      # Docker SD emits one target per *exposed port*. Keep only the HTTP port:
      # gRPC is 50053..50058, HTTP is 80xx. Dropping the gRPC ports here avoids
      # a duplicate target per service pointing at the wrong port.
      - source_labels: [__meta_docker_port_private]
        regex: "5005[0-9]"
        action: drop
      - source_labels: [__meta_docker_network_ip, __meta_docker_port_private]
        target_label: __address__
        separator: ":"
        regex: "(.+):(.+)"
        replacement: "${1}:${2}"
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

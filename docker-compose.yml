services:
  db:
    image: postgres:18-alpine3.24
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: shopping
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super@password

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:

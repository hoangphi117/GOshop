      - "50056:50056"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_cart
      - CART_DB_NAME=shopping_cart
      - CART_SERVER_PORT=8087
      - CART_GRPC_PORT=50056
      - CATALOG_GRPC_ADDR=catalog-service:50055
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
      catalog:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - cart-service

  banner:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: banner
    container_name: goshop-banner
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8089:8089"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_banner
      - BANNER_DB_NAME=shopping_banner
      - BANNER_SERVER_PORT=8089
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - REDIS_ADDR=redis:6379
      # Dev broker is PLAINTEXT; drop the prod-only TLS block from backend/.env
      # (see the kafka service). Without this, banner dies at "load TLS CA".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - GOMEMLIMIT=96MiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/certs:/app/certs:ro
    networks:
      goshop-network:
        aliases:
          - banner-service

  review:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: review
    container_name: goshop-review
    restart: unless-stopped
    ports:
      - "8091:8091"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_review
      - REVIEW_DB_NAME=shopping_review
      - REVIEW_SERVER_PORT=8091
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is

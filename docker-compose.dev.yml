services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - API_KEY=${API_KEY:?API_KEY must be set (edge injects it server-side)}
      - MEILISEARCH_MASTER_KEY=${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY must be set (edge injects it for /search-api)}
      # Rendered into the storefront/dashboard CSP connect-src. Dev uploads go
      # to MinIO (path style), so S3_ENDPOINT is already the origin; without the
      # variable nginx exits on 'unknown "s3_public_origin" variable' and
      # restart-loops. Composes fine overridden via S3_PUBLIC_ORIGIN in .env.
      - S3_PUBLIC_ORIGIN=${S3_PUBLIC_ORIGIN:-${S3_ENDPOINT:-}}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/secret-conf
    volumes:
      - type: tmpfs
        target: /etc/nginx/secret-conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./backend/uploads:/var/www/uploads:ro
      # Admin dashboard SPA — static build from the host (or CI artifact).
      - ./frontend/apps/dashboard/dist:/srv/dashboard:ro
    depends_on:
      - api
    networks:
      - goshop-network

  api:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: api
    container_name: goshop-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - MEILISEARCH_HOST=http://meilisearch:7700
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - NOTIFICATION_SERVICE_URL=http://notification-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8083
      - PAYMENT_GRPC_ADDR=payment-service:50052
      - ORDER_SERVICE_URL=http://order-service:8088
      - ORDER_GRPC_TARGET=order-service:50057
      - BANNER_SERVICE_URL=http://banner-service:8089
      - REVIEW_SERVICE_URL=http://review-service:8091
      - ANALYTICS_SERVICE_URL=http://analytics:8092
      - CHAT_SERVICE_URL=http://chat:8093
      # backend/.env has http://localhost:8085 for host-run setups; inside the
      # container that is the container itself, so the gateway answered 502 on
      # any /api/v1/ws request that reached it. nginx happens to intercept
      # /api/v1/ws first and route it straight to ws-gateway, which hid this.
      - WS_GATEWAY_URL=http://ws-gateway:8085
      - CATALOG_SERVICE_URL=http://catalog:8086
      - CART_SERVICE_URL=http://cart:8087
      - COUPON_SERVICE_URL=http://coupon:8084
      # Without this the assistant routes 404 at the gateway: the service runs
      # in its own container, the api proxy has nothing to forward to.
      - ASSISTANT_SERVICE_URL=http://assistant-service:8097
      - INVENTORY_SERVICE_URL=http://inventory:8090
      - MEDIA_SERVICE_URL=http://media:8094
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - S3_ENDPOINT=http://minio:9000
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - api
          - api1
          - api2
          - core-backend

  identity:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: identity
    container_name: goshop-identity
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "50051:50051"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_identity
      - IDENTITY_DB_NAME=shopping_identity
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - MEILISEARCH_HOST=http://meilisearch:7700
      - IDENTITY_SERVER_PORT=8081
      - IDENTITY_GRPC_PORT=:50051
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=true
      - JWT_PRIVATE_KEY=/app/certs/jwt_private.pem
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - identity-service

  notification:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: notification
    container_name: goshop-notification
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_notification
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - NOTIFICATION_SERVER_PORT=8082
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - notification-service

  media:
    # The gateway proxies /api/v1/upload/* to MEDIA_SERVICE_URL
    # (http://media:8094). Uploads are stateless, so this service needs no DB —
    # only Redis, Kafka and the storage backend from backend/.env.
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: media
    container_name: goshop-media
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8094:8094"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - MEDIA_SERVER_PORT=8094
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      # backend/.env has S3_ENDPOINT=http://localhost:9000 for host-run setups;
      # inside the container MinIO is reachable as minio:9000.
      - S3_ENDPOINT=http://minio:9000
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - media-service

  analytics:
    # The gateway proxies /api/v1/admin/analytics/* to ANALYTICS_SERVICE_URL
    # (http://analytics:8092). Without this service every admin dashboard chart
    # returned 502 (DNS: lookup analytics: no such host).
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: analytics
    container_name: goshop-analytics
    restart: unless-stopped
    mem_limit: 192m
    ports:
      - "8092:8092"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_analytics
      - ANALYTICS_DB_NAME=shopping_analytics
      - ANALYTICS_SERVER_PORT=8092
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      # backend/.env points these at localhost for host-run binaries; inside the
      # container that resolves to the container itself.
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - CATALOG_GRPC_TARGET=catalog-service:50055
      - ORDER_GRPC_TARGET=order-service:50057
      - INVENTORY_GRPC_ADDR=inventory-service:50054
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity:
        condition: service_started
      order:
        condition: service_started
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - analytics-service

  assistant:
    # Public AI shopping assistant. No DB, no Kafka: sessions live in Redis and
    # every product fact is read through catalog. The LLM key stays in
    # backend/.env (server-side only, never in a browser bundle).
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: assistant
    container_name: goshop-assistant
    restart: unless-stopped
    mem_limit: 192m
    ports:
      - "8097:8097"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - ASSISTANT_SERVER_PORT=8097
      - REDIS_ADDR=redis:6379
      - CATALOG_GRPC_TARGET=catalog-service:50055
      - CATALOG_BASE_URL=http://catalog:8086
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - assistant-service

  payment:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: payment
    container_name: goshop-payment
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "50052:50052"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_payment
      - PAYMENT_DB_NAME=shopping_payment
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - PAYMENT_SERVER_PORT=8083
      - PAYMENT_GRPC_PORT=50052
      - ORDER_GRPC_ADDR=order-service:50057
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - payment-service

  catalog:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: catalog
    container_name: goshop-catalog
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8086:8086"
      - "50055:50055"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_catalog
      - CATALOG_DB_NAME=shopping_catalog
      - CATALOG_SERVER_PORT=8086
      - CATALOG_GRPC_PORT=50055
      - JWT_PRIVATE_KEY=
      - INVENTORY_GRPC_ADDR=inventory-service:50054
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - MEILISEARCH_HOST=http://meilisearch:7700
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
      meilisearch:
        condition: service_started
      inventory:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - catalog-service

  inventory:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: inventory
    container_name: goshop-inventory
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8090:8090"
      - "50054:50054"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_inventory
      - INVENTORY_DB_NAME=shopping_inventory
      - INVENTORY_SERVER_PORT=8090
      - INVENTORY_GRPC_PORT=50054
      - JWT_PRIVATE_KEY=
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - inventory-service

  coupon:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: coupon
    container_name: goshop-coupon
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8084:8084"
      - "50053:50053"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_coupon
      - COUPON_DB_NAME=shopping_coupon
      - COUPON_SERVER_PORT=8084
      - COUPON_GRPC_PORT=50053
      - JWT_PRIVATE_KEY=
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - GOMEMLIMIT=96MiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - coupon-service

  cart:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: cart
    container_name: goshop-cart
    restart: unless-stopped
    mem_limit: 160m
    ports:

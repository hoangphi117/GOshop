      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - CATALOG_GRPC_TARGET=catalog-service:50055
      - ORDER_GRPC_TARGET=order-service:50057
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    mem_limit: 192m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/certs:/app/certs:ro
    networks:
      goshop-network:
        aliases:
          - review-service

  order:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: order
    container_name: goshop-order
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "50057:50057"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_order
      - ORDER_DB_NAME=shopping_order
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - ORDER_SERVER_PORT=8088
      - ORDER_GRPC_PORT=50057
      - CATALOG_GRPC_ADDR=catalog-service:50055
      - INVENTORY_GRPC_ADDR=inventory-service:50054
      - COUPON_GRPC_ADDR=coupon-service:50053
      - CART_GRPC_ADDR=cart-service:50056
      - GOMEMLIMIT=192MiB
      - GOMAXPROCS=1
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - PAYMENT_GRPC_ADDR=payment-service:50052
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      coupon:
        condition: service_started
      cart:
        condition: service_started
      identity:
        condition: service_started
      payment:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - order-service

  chat:
    # Storefront calls /api/v1/chat/* on page load; the api gateway proxies
    # those to CHAT_SERVICE_URL=http://chat:8093. Without this service the
    # widget 502s on every page (DNS: lookup chat: no such host).
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: chat
    container_name: goshop-chat
    restart: unless-stopped
    ports:
      - "8093:8093"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_chat
      - CHAT_DB_NAME=shopping_chat
      - CHAT_SERVER_PORT=8093
      - CHAT_GRPC_PORT=50058
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - ORDER_GRPC_TARGET=order-service:50057
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    mem_limit: 192m
    cpus: 0.50
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity:
        condition: service_started
      order:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - chat-service

  worker:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: worker
    container_name: goshop-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      # Dev broker is PLAINTEXT (see the kafka service below) and no TLS cert is
      # mounted into dev containers, so the TLS block that gen-kafka-env.ps1
      # merges into backend/.env for prod must not reach a dev run. Without
      # this, clients die with "load TLS CA: open /app/kafka/tls/ca.crt".
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - MEILISEARCH_HOST=http://meilisearch:7700
      # worker serves no HTTP router, so it is the one service that needs the
      # separate /metrics listener (shared/pkg/metrics.ListenAndServe).
      - METRICS_PORT=9464
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      - goshop-network

  ws-gateway:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service
      args:
        SERVICE: ws-gateway
    container_name: goshop-ws-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_ADDR=redis:6379
      - WS_GATEWAY_PORT=8085
      - APP_ENV=development
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      # backend/.env points these at localhost for host-run binaries; inside a
      # container that is the container itself. Without the identity address
      # the gRPC resolver dialled localhost and every handshake got 401.
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - CHAT_GRPC_TARGET=chat:50058
      - KAFKA_TLS_ENABLED=false
      - KAFKA_TLS_CA_FILE=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      # The gateway verifies access tokens with the RSA public key. It runs the
      # prod Dockerfile (no ./backend:/app bind), so without this mount
      # /app/certs does not exist, jwt.ParseRSAPublicKeyFromPEM never runs, and
      # every connection fails at ParseToken with "Invalid authentication token".
      - ./backend/certs:/app/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_started
      chat:
        condition: service_started
    networks:
      - goshop-network

  postgres:
    image: postgres:16-alpine
    container_name: goshop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150 -c shared_buffers=256MB -c work_mem=16MB
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super@password}
      POSTGRES_DB: ${DB_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  redis:
    image: redis:alpine
    container_name: goshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: goshop-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092,CONTROLLER://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      # Pin the same cluster id as prod: dev and prod share the physical
      # kafka-data volume on a single-host setup, and a mismatched id makes
      # the broker refuse to start ("Invalid cluster.id in meta.properties").
      CLUSTER_ID: goshop-prod-kafka-000000001
    ports:
      - "9092:9092"
    volumes:
      # apache/kafka:3.9.0 writes to /tmp/kafka-logs by default (log in
      # Nov 2026 showed LogLoader loading from there); the old mount on
      # /var/lib/kafka/data saved nothing, so every restart wiped topics.
      - kafka-data:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - goshop-network

  kafka-init:
    # One-shot: creates the domain topics from the plan (§4.1) before any
    # consumer starts. AUTO_CREATE is off so a typo fails loudly here.
    image: apache/kafka:3.9.0
    container_name: goshop-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.order.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.order-return.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.payment.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.user.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.email.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.inventory.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.review.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.notification.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.media.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.shipping.v1 --partitions 1 --replication-factor 1
        for d in order order-return payment user email inventory review notification media shipping; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "goshop.$${d}.v1.dlq" --partitions 1 --replication-factor 1
          # Phase 3: DLQ records are the forensic record of a failure, so they
          # never expire. Domain topics keep the broker default.
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter --entity-type topics --entity-name "goshop.$${d}.v1.dlq" --add-config retention.ms=-1
        done
        echo "kafka topics ready"
    networks:
      - goshop-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: goshop-kafka-ui
    restart: unless-stopped
    ports:
      # 8086 is the catalog service; 8096 keeps the UI out of its way.
      - "8096:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: goshop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - goshop-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: goshop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-goshop_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-goshop_secret_key}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - goshop-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: goshop-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-masterKey123}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - goshop-network

  jaeger:
    # Dev-only tracing backend: receives OTLP and serves the trace UI.
    image: jaegertracing/all-in-one:1.62.0
    container_name: goshop-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP (host-side services export here)
    networks:
      - goshop-network

  promtail:
    # Ships container logs to Grafana Cloud Loki (no local Loki).
    image: grafana/promtail:3.5.1
    container_name: goshop-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    env_file:
      - ./backend/.env
    volumes:
      - ./system/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - goshop-network

  kafka-exporter:
    # Broker-side lag/throughput metrics on :9308. The dev broker runs
    # PLAINTEXT, so no SASL flags here (prod has them).
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: goshop-kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:29092
      - --web.listen-address=:9308
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - goshop-network

  prometheus:
    # Scrapes kafka-exporter plus every goshop-* container on its own HTTP port
    # (see system/prometheus/prometheus.yml). Rules live in
    # system/prometheus/rules/.
    image: prom/prometheus:v3.6.0
    container_name: goshop-prometheus
    restart: unless-stopped
    # The image runs as nobody (65534) and the host docker socket is root:root,
    # so unprivileged docker service discovery fails with "permission denied"
    # (only logs, no missing target). Prometheus itself needs no privileges:
    # it reads the mounted config, writes only /prometheus, and has no shell in
    # the flow. Reading the socket is the single capability this grants.
    user: "0:0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./system/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./system/prometheus/rules:/etc/prometheus/rules:ro
      # Read-only socket for docker service discovery (same privilege as
      # promtail).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus-data:/prometheus
    depends_on:
      - kafka-exporter
    networks:
      - goshop-network

  alertmanager:
    # Fans Prometheus alerts out to Discord (native discord_configs). Config
    # template in system/alertmanager/alertmanager.yml; the webhook URL is
    # substituted from ALERTMANAGER_DISCORD_WEBHOOK_URL at container start,
    # because Alertmanager does not expand env vars in its own config. An empty
    # URL falls back to alertmanager.silent.yml so dev still starts.
    image: prom/alertmanager:v0.29.0
    container_name: goshop-alertmanager
    restart: unless-stopped
    environment:
      ALERTMANAGER_DISCORD_WEBHOOK_URL: ${ALERTMANAGER_DISCORD_WEBHOOK_URL:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -n "$$ALERTMANAGER_DISCORD_WEBHOOK_URL" ]; then
          sed "s|__ALERTMANAGER_DISCORD_WEBHOOK_URL__|$$ALERTMANAGER_DISCORD_WEBHOOK_URL|g" \
            /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml
        else
          echo "WARN ALERTMANAGER_DISCORD_WEBHOOK_URL is empty: alerts will fire but not reach Discord" >&2
          cp /etc/alertmanager/alertmanager.silent.yml /tmp/alertmanager.yml
        fi
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.external-url=http://localhost:9093
    ports:
      - "9093:9093"
    volumes:
      - ./system/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - ./system/alertmanager/alertmanager.silent.yml:/etc/alertmanager/alertmanager.silent.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      - prometheus
    networks:
      - goshop-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  minio-data:
    driver: local
  meilisearch-data:
    driver: local
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  goshop-network:
    driver: bridge
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/uploads:/var/www/uploads:ro
    depends_on:
      - api
    networks:
      - goshop-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.dev
    container_name: goshop-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - NOTIFICATION_SERVICE_URL=http://notification-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8083
      - PAYMENT_GRPC_ADDR=payment-service:50052
      - ORDER_SERVICE_URL=http://order-service:8088
      - ORDER_GRPC_TARGET=order-service:50057
      - BANNER_SERVICE_URL=http://banner-service:8089
      - REVIEW_SERVICE_URL=http://review-service:8091
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - S3_ENDPOINT=http://minio:9000
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - api
          - api1
          - api2
          - core-backend

  identity:
    build:
      context: ./backend
      dockerfile: Dockerfile.identity.dev
    container_name: goshop-identity
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "50051:50051"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_identity
      - IDENTITY_DB_NAME=shopping_identity
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
      - IDENTITY_SERVER_PORT=8081
      - IDENTITY_GRPC_PORT=:50051
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=true
      - JWT_PRIVATE_KEY=/app/certs/jwt_private.pem
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - identity-service

  notification:
    build:
      context: ./backend
      dockerfile: Dockerfile.notification.dev
    container_name: goshop-notification
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_notification
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - NOTIFICATION_SERVER_PORT=8082
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - notification-service

  payment:
    build:
      context: ./backend
      dockerfile: Dockerfile.payment.dev
    container_name: goshop-payment
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "50052:50052"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_payment
      - PAYMENT_DB_NAME=shopping_payment
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - PAYMENT_SERVER_PORT=8083
      - PAYMENT_GRPC_PORT=50052
      - ORDER_GRPC_ADDR=order-service:50057
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - payment-service

  catalog:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.dev
      args:
        SERVICE: catalog
    container_name: goshop-catalog
    restart: unless-stopped
    ports:
      - "8086:8086"
      - "50055:50055"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_catalog
      - CATALOG_DB_NAME=shopping_catalog
      - CATALOG_SERVER_PORT=8086
      - CATALOG_GRPC_PORT=50055
      - JWT_PRIVATE_KEY=
      - INVENTORY_GRPC_ADDR=inventory-service:50054
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
      - GOMEMLIMIT=128MiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    mem_limit: 160m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_started
      inventory:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - catalog-service

  inventory:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.dev
      args:
        SERVICE: inventory
    container_name: goshop-inventory
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "50054:50054"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_inventory
      - INVENTORY_DB_NAME=shopping_inventory
      - INVENTORY_SERVER_PORT=8090
      - INVENTORY_GRPC_PORT=50054
      - JWT_PRIVATE_KEY=
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - GOMEMLIMIT=128MiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    mem_limit: 160m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - inventory-service

  coupon:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.dev
      args:
        SERVICE: coupon
    container_name: goshop-coupon
    restart: unless-stopped
    ports:
      - "8084:8084"
      - "50053:50053"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_coupon
      - COUPON_DB_NAME=shopping_coupon
      - COUPON_SERVER_PORT=8084
      - COUPON_GRPC_PORT=50053
      - JWT_PRIVATE_KEY=
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - GOMEMLIMIT=96MiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    mem_limit: 128m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - coupon-service

  cart:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.dev
      args:
        SERVICE: cart
    container_name: goshop-cart
    restart: unless-stopped
    ports:
      - "8087:8087"
      - "50056:50056"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_cart
      - CART_DB_NAME=shopping_cart
      - CART_SERVER_PORT=8087
      - CART_GRPC_PORT=50056
      - CATALOG_GRPC_ADDR=catalog-service:50055
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - GOMEMLIMIT=128MiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    mem_limit: 160m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - cart-service

  banner:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.dev
      args:
        SERVICE: banner
    container_name: goshop-banner
    restart: unless-stopped
    ports:
      - "8089:8089"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_banner
      - BANNER_DB_NAME=shopping_banner
      - BANNER_SERVER_PORT=8089
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - REDIS_ADDR=redis:6379
      - GOMEMLIMIT=96MiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    mem_limit: 128m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/certs:/app/certs:ro
    networks:
      goshop-network:
        aliases:
          - banner-service

  review:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservice.dev
      args:
        SERVICE: review
    container_name: goshop-review
    restart: unless-stopped
    ports:
      - "8091:8091"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_review
      - REVIEW_DB_NAME=shopping_review
      - REVIEW_SERVER_PORT=8091
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - CATALOG_GRPC_TARGET=catalog-service:50055
      - ORDER_GRPC_TARGET=order-service:50057
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - GOMEMLIMIT=128MiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    mem_limit: 192m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/certs:/app/certs:ro
    networks:
      goshop-network:
        aliases:
          - review-service

  order:
    build:
      context: ./backend
      dockerfile: Dockerfile.order.dev
    container_name: goshop-order
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "50057:50057"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_order
      - ORDER_DB_NAME=shopping_order
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - ORDER_SERVER_PORT=8088
      - ORDER_GRPC_PORT=50057
      - CATALOG_GRPC_ADDR=catalog-service:50055
      - INVENTORY_GRPC_ADDR=inventory-service:50054
      - COUPON_GRPC_ADDR=coupon-service:50053
      - CART_GRPC_ADDR=cart-service:50056
      - GOMEMLIMIT=192MiB
      - GOMAXPROCS=1
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - PAYMENT_GRPC_ADDR=payment-service:50052
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      coupon:
        condition: service_started
      cart:
        condition: service_started
      identity:
        condition: service_started
      payment:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - order-service

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.dev
    container_name: goshop-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - goshop-network

  ws-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.ws-gateway.prod
    container_name: goshop-ws-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_ADDR=redis:6379
      - WS_GATEWAY_PORT=8085
      - APP_ENV=development
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - goshop-network

  postgres:
    image: postgres:16-alpine
    container_name: goshop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150 -c shared_buffers=256MB -c work_mem=16MB
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super@password}
      POSTGRES_DB: ${DB_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  redis:
    image: redis:alpine
    container_name: goshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: goshop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-goshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-goshop}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: goshop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-goshop_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-goshop_secret_key}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - goshop-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: goshop-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-masterKey123}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - goshop-network

  jaeger:
    # Dev-only tracing backend: receives OTLP and serves the trace UI.
    image: jaegertracing/all-in-one:1.62.0
    container_name: goshop-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP (host-side services export here)
    networks:
      - goshop-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local
  meilisearch-data:
    driver: local

networks:
  goshop-network:
    driver: bridge

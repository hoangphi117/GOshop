services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - API_KEY=${API_KEY:?API_KEY must be set (edge injects it server-side)}
      - MEILISEARCH_MASTER_KEY=${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY must be set (edge injects it for /search-api)}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/secret-conf
    volumes:
      - type: tmpfs
        target: /etc/nginx/secret-conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./backend/uploads:/var/www/uploads:ro
      # Admin dashboard SPA — static build from the host (or CI artifact).
      - ./frontend/apps/dashboard/dist:/srv/dashboard:ro
    depends_on:
      - api
    networks:
      - goshop-network

  api:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: api
    container_name: goshop-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - MEILISEARCH_HOST=http://meilisearch:7700
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - NOTIFICATION_SERVICE_URL=http://notification-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8083
      - PAYMENT_GRPC_ADDR=payment-service:50052
      - ORDER_SERVICE_URL=http://order-service:8088
      - ORDER_GRPC_TARGET=order-service:50057
      - BANNER_SERVICE_URL=http://banner-service:8089
      - REVIEW_SERVICE_URL=http://review-service:8091
      - ANALYTICS_SERVICE_URL=http://analytics:8092
      - CHAT_SERVICE_URL=http://chat:8093
      - CATALOG_SERVICE_URL=http://catalog:8086
      - CART_SERVICE_URL=http://cart:8087
      - COUPON_SERVICE_URL=http://coupon:8084
      - INVENTORY_SERVICE_URL=http://inventory:8090
      - MEDIA_SERVICE_URL=http://media:8094
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - S3_ENDPOINT=http://minio:9000
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - api
          - api1
          - api2
          - core-backend

  identity:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: identity
    container_name: goshop-identity
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "50051:50051"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_identity
      - IDENTITY_DB_NAME=shopping_identity
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - MEILISEARCH_HOST=http://meilisearch:7700
      - IDENTITY_SERVER_PORT=8081
      - IDENTITY_GRPC_PORT=:50051
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=true
      - JWT_PRIVATE_KEY=/app/certs/jwt_private.pem
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - identity-service

  notification:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: notification
    container_name: goshop-notification
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_notification
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - NOTIFICATION_SERVER_PORT=8082
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - notification-service

  payment:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: payment
    container_name: goshop-payment
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "50052:50052"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_payment
      - PAYMENT_DB_NAME=shopping_payment
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - PAYMENT_SERVER_PORT=8083
      - PAYMENT_GRPC_PORT=50052
      - ORDER_GRPC_ADDR=order-service:50057
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - payment-service

  catalog:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: catalog
    container_name: goshop-catalog
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8086:8086"
      - "50055:50055"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_catalog
      - CATALOG_DB_NAME=shopping_catalog
      - CATALOG_SERVER_PORT=8086
      - CATALOG_GRPC_PORT=50055
      - JWT_PRIVATE_KEY=
      - INVENTORY_GRPC_ADDR=inventory-service:50054
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - MEILISEARCH_HOST=http://meilisearch:7700
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
      meilisearch:
        condition: service_started
      inventory:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - catalog-service

  inventory:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: inventory
    container_name: goshop-inventory
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8090:8090"
      - "50054:50054"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_inventory
      - INVENTORY_DB_NAME=shopping_inventory
      - INVENTORY_SERVER_PORT=8090
      - INVENTORY_GRPC_PORT=50054
      - JWT_PRIVATE_KEY=
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - inventory-service

  coupon:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: coupon
    container_name: goshop-coupon
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8084:8084"
      - "50053:50053"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_coupon
      - COUPON_DB_NAME=shopping_coupon
      - COUPON_SERVER_PORT=8084
      - COUPON_GRPC_PORT=50053
      - JWT_PRIVATE_KEY=
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - GOMEMLIMIT=96MiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      goshop-network:
        aliases:
          - coupon-service

  cart:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: cart
    container_name: goshop-cart
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8087:8087"
      - "50056:50056"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_cart
      - CART_DB_NAME=shopping_cart
      - CART_SERVER_PORT=8087
      - CART_GRPC_PORT=50056
      - CATALOG_GRPC_ADDR=catalog-service:50055
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
      catalog:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - cart-service

  banner:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: banner
    container_name: goshop-banner
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - "8089:8089"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_banner
      - BANNER_DB_NAME=shopping_banner
      - BANNER_SERVER_PORT=8089
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - REDIS_ADDR=redis:6379
      - GOMEMLIMIT=96MiB
      - GOMAXPROCS=1
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/certs:/app/certs:ro
    networks:
      goshop-network:
        aliases:
          - banner-service

  review:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: review
    container_name: goshop-review
    restart: unless-stopped
    ports:
      - "8091:8091"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_review
      - REVIEW_DB_NAME=shopping_review
      - REVIEW_SERVER_PORT=8091
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - CATALOG_GRPC_TARGET=catalog-service:50055
      - ORDER_GRPC_TARGET=order-service:50057
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - GOMEMLIMIT=1GiB
      - GOMAXPROCS=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    mem_limit: 192m
    cpus: 0.50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/certs:/app/certs:ro
    networks:
      goshop-network:
        aliases:
          - review-service

  order:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: order
    container_name: goshop-order
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "50057:50057"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_order
      - ORDER_DB_NAME=shopping_order
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - ORDER_SERVER_PORT=8088
      - ORDER_GRPC_PORT=50057
      - CATALOG_GRPC_ADDR=catalog-service:50055
      - INVENTORY_GRPC_ADDR=inventory-service:50054
      - COUPON_GRPC_ADDR=coupon-service:50053
      - CART_GRPC_ADDR=cart-service:50056
      - GOMEMLIMIT=192MiB
      - GOMAXPROCS=1
      - IDENTITY_GRPC_ADDR=identity-service:50051
      - PAYMENT_GRPC_ADDR=payment-service:50052
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      coupon:
        condition: service_started
      cart:
        condition: service_started
      identity:
        condition: service_started
      payment:
        condition: service_started
    networks:
      goshop-network:
        aliases:
          - order-service

  worker:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service.dev
      args:
        SERVICE: worker
    container_name: goshop-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - MEILISEARCH_HOST=http://meilisearch:7700
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:

        condition: service_completed_successfully
    networks:
      - goshop-network

  ws-gateway:
    build:
      context: ./backend
      dockerfile: build/Dockerfile.service
      args:
        SERVICE: ws-gateway
    container_name: goshop-ws-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_ADDR=redis:6379
      - WS_GATEWAY_PORT=8085
      - APP_ENV=development
      - JWT_SIGNING_ENABLED=false
      - JWT_PRIVATE_KEY=
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - goshop-network

  postgres:
    image: postgres:16-alpine
    container_name: goshop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150 -c shared_buffers=256MB -c work_mem=16MB
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super@password}
      POSTGRES_DB: ${DB_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  redis:
    image: redis:alpine
    container_name: goshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: goshop-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092,CONTROLLER://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      # Pin the same cluster id as prod: dev and prod share the physical
      # kafka-data volume on a single-host setup, and a mismatched id makes
      # the broker refuse to start ("Invalid cluster.id in meta.properties").
      CLUSTER_ID: goshop-prod-kafka-000000001
    ports:
      - "9092:9092"
    volumes:
      # apache/kafka:3.9.0 writes to /tmp/kafka-logs by default (log in
      # Nov 2026 showed LogLoader loading from there); the old mount on
      # /var/lib/kafka/data saved nothing, so every restart wiped topics.
      - kafka-data:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - goshop-network

  kafka-init:
    # One-shot: creates the domain topics from the plan (§4.1) before any
    # consumer starts. AUTO_CREATE is off so a typo fails loudly here.
    image: apache/kafka:3.9.0
    container_name: goshop-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.order.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.order-return.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.payment.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.user.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.email.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.inventory.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.review.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.notification.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.media.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic goshop.shipping.v1 --partitions 1 --replication-factor 1
        for d in order order-return payment user email inventory review notification media shipping; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "goshop.$${d}.v1.dlq" --partitions 1 --replication-factor 1
          # Phase 3: DLQ records are the forensic record of a failure, so they
          # never expire. Domain topics keep the broker default.
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter --entity-type topics --entity-name "goshop.$${d}.v1.dlq" --add-config retention.ms=-1
        done
        echo "kafka topics ready"
    networks:
      - goshop-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: goshop-kafka-ui
    restart: unless-stopped
    ports:
      # 8086 is the catalog service; 8096 keeps the UI out of its way.
      - "8096:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: goshop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - goshop-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: goshop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-goshop_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-goshop_secret_key}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - goshop-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: goshop-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-masterKey123}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - goshop-network

  jaeger:
    # Dev-only tracing backend: receives OTLP and serves the trace UI.
    image: jaegertracing/all-in-one:1.62.0
    container_name: goshop-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP (host-side services export here)
    networks:
      - goshop-network

  promtail:
    # Ships container logs to Grafana Cloud Loki (no local Loki).
    image: grafana/promtail:3.5.1
    container_name: goshop-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    env_file:
      - ./backend/.env
    volumes:
      - ./system/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - goshop-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  minio-data:
    driver: local
  meilisearch-data:
    driver: local

networks:
  goshop-network:
    driver: bridge
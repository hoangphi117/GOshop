services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/uploads:/var/www/uploads:ro
    depends_on:
      - api
    networks:
      - goshop-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.dev
    container_name: goshop-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
      - IDENTITY_SERVICE_URL=http://identity-service:8081
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_PRIVATE_KEY=/app/certs/jwt_private.pem
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - api
          - api1
          - api2
          - core-backend

  identity:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.dev
    container_name: goshop-identity
    restart: unless-stopped
    command: air -c .air.identity.toml
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_NAME=shopping_identity
      - IDENTITY_DB_NAME=shopping_identity
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
      - IDENTITY_SERVER_PORT=8081
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-goshop-internal-secret-token}
      - JWT_PRIVATE_KEY=/app/certs/jwt_private.pem
      - JWT_PUBLIC_KEY=/app/certs/jwt_public.pem
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      goshop-network:
        aliases:
          - identity-service

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.dev
    container_name: goshop-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-goshop}:${RABBITMQ_PASSWORD:-goshop}@rabbitmq:5672/
      - MEILISEARCH_HOST=http://meilisearch:7700
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - goshop-network

  ws-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.ws-gateway.prod
    container_name: goshop-ws-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=shopping
      - REDIS_ADDR=redis:6379
      - WS_GATEWAY_PORT=8085
      - APP_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - goshop-network

  postgres:
    image: postgres:16-alpine
    container_name: goshop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150 -c shared_buffers=256MB -c work_mem=16MB
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super@password}
      POSTGRES_DB: ${DB_NAME:-shopping}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-shopping}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  redis:
    image: redis:alpine
    container_name: goshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: goshop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-goshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-goshop}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: goshop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-goshop_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-goshop_secret_key}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - goshop-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: goshop-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-masterKey123}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - goshop-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local
  meilisearch-data:
    driver: local

networks:
  goshop-network:
    driver: bridge


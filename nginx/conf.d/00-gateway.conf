# =============================================================================
# API gateway hardening: request id + rate limiting.
# Included from http{} context (nginx.conf includes conf.d/*.conf).
#
# Empty map results make limit_req skip the request. Login/register endpoints
# get their own tight bucket; webhook endpoints (shared provider IPs) are
# exempt from the general API bucket.
# =============================================================================

map $uri $limit_auth_key {
    ~*^/api/v1/auth(/|$)  $binary_remote_addr;
    default               "";
}

map $uri $limit_api_key {
    ~*webhook             "";
    default               $binary_remote_addr;
}

limit_req_zone $limit_auth_key zone=auth:10m rate=5r/s;
limit_req_zone $limit_api_key  zone=api:10m   rate=50r/s;

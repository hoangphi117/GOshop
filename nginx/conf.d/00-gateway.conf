# =============================================================================
# API gateway hardening: request id + rate limiting.
# Included from http{} context (nginx.conf includes conf.d/*.conf).
#
# Empty map results make limit_req skip the request. Login/register endpoints
# get their own tight bucket; webhook endpoints (shared provider IPs) are
# exempt from the general API bucket.
# =============================================================================

map $uri $limit_auth_key {
    ~*^/api/v1/auth(/|$)  $binary_remote_addr;
    default               "";
}

map $uri $limit_api_key {
    ~*webhook             "";
    default               $binary_remote_addr;
}

# Read vs write split: browsing traffic (GET) is cheap and cacheable, so it gets
# a wide bucket; everything that mutates (POST/PUT/PATCH/DELETE: checkout,
# payment, admin actions) shares a tight bucket. Keyed on method + IP so a
# scraper can't exhaust the write budget and vice versa.
map "$request_method:$limit_api_key" $limit_read_key {
    ~*^(GET|HEAD|OPTIONS):(.+)$  $2;
    default                      "";
}

map "$request_method:$limit_api_key" $limit_write_key {
    ~*^(GET|HEAD|OPTIONS):.*$  "";
    ~*^.*:(.+)$                $1;
    default                    "";
}

limit_req_zone $limit_auth_key  zone=auth:10m       rate=5r/s;
limit_req_zone $limit_read_key  zone=api_read:10m   rate=100r/s;
limit_req_zone $limit_write_key zone=api_write:10m  rate=10r/s;

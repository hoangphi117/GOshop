# Dev-only server block: exposes the host's `next dev` (:3001) through the same
# edge that owns :80, so the browser sees ONE origin per port.
#
# Why this exists: the storefront page and the API must share an origin, or the
# HttpOnly refresh cookie (`Path=/api/v1/auth`, `SameSite=Lax`) is set by a
# cross-origin response and then refused on the cross-site POST to
# /api/v1/auth/refresh. The symptom is not a CORS error: the API answers
# 400 "Refresh token is required", restoreSession() resets the store, and the
# navbar falls back to "Sign In / Register" right after a successful signup.
#
# `host.docker.internal` rather than 127.0.0.1: nginx runs in a container, and
# on Docker Desktop a container's own loopback is not the Windows host. The
# comment in docker-compose.dev.yml:674 says the same about :3001.
#
# Not loaded in prod: only docker-compose.dev.yml mounts nginx/conf.d.
server {
    listen 3001;
    listen [::]:3001;
    server_name localhost;

    client_max_body_size 20m;

    # No include here: /etc/nginx/secret-conf/00-api-key.conf holds `map {}`,
    # which is http-scope only. nginx.conf already includes it at http level, so
    # $goshop_api_key / $goshop_meili_key are already defined for this server.

    location /api/v1/ws {
        set $ws3001 http://ws-gateway:8085;
        proxy_pass $ws3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/v1/ {
        set $api3001 http://api:8080;
        proxy_pass $api3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-API-KEY $goshop_api_key;
        proxy_set_header X-Client-App storefront;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    # Uploaded media. The prod edge serves the bucket on /goshop-media/ from
    # goshop-locations.inc, and every stored URL is edge-relative on purpose, so
    # this block has to answer on its own port too — otherwise getImageUrl()
    # resolves banners to http://localhost:3001/goshop-media/... and every image
    # 404s.
    #
    # `^~` plus a proxy_pass with NO uri: path and query are forwarded verbatim.
    # Appending a uri here would duplicate the prefix (/goshop-media/goshop-media/…)
    # and MinIO answers 403. Host must be $http_host for the same reason.
    location ^~ /goshop-media/ {
        set $minio3001 http://minio:9000;
        proxy_pass $minio3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /search-api/ {
        set $meili3001 http://meilisearch:7700/;
        proxy_pass $meili3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer $goshop_meili_key";
    }

    # Everything else is the dev server itself, HMR websocket included.
    # :3002, not :3001 — :3001 is the port THIS block listens on, so `next dev`
    # has to move off it (npm run dev -- --port 3002).
    location / {
        set $next3001 http://host.docker.internal:3002;
        proxy_pass $next3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

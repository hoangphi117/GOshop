upstream goshop_backend {
    least_conn;
    server api:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name localhost shop.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    include /etc/nginx/conf.d/goshop-locations.inc;
}
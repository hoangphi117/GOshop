# =============================================================================
# GOSHOP REVERSE PROXY & LOAD BALANCER CONFIGURATION (NGINX)
# =============================================================================
# Thiết kế: Senior Backend / System Designer
# Mục tiêu:
#   1. Reverse Proxy định tuyến traffic cho REST API, WebSocket & Storefront
#   2. Load Balancer phân tải thông minh (least_conn) cho Go backend instances
#   3. Static File Offloading: Nginx phục vụ trực tiếp thư mục /uploads/ giúp giải phóng CPU cho Go
#   4. WebSocket Upgrade: Duy trì kết nối thời gian thực ổn định (3600s timeout)
#   5. Header Sanitization: Đảm bảo chuyển giao đúng Real-IP và SSL context cho Gin Engine
# =============================================================================

# 1. UPSTREAM POOL - LOAD BALANCER CHO GO BACKEND
upstream goshop_backend {
    # Thuật toán least_conn: chuyển request đến instance có ít active connection nhất
    # Phù hợp đặc thù hệ thống có cả REST (short-lived) và WebSocket (long-lived)
    least_conn;

    # Danh sách các Backend Instances trong mạng nội bộ Docker
    server api:8080 max_fails=3 fail_timeout=30s;
    # Khi scale ngang (Giai đoạn 2), chỉ cần mở comment các instance tiếp theo:
    # server api2:8080 max_fails=3 fail_timeout=30s;
    # server api3:8080 max_fails=3 fail_timeout=30s;

    # Duy trì pool 32 kết nối keepalive tới backend để giảm chi phí TCP Handshake
    keepalive 32;
}

# 2. DOCKER EMBEDDED DNS RESOLVER
# Cho phép Nginx phân giải động tên miền nội bộ Docker khi runtime mà không bị crash khi service khởi động sau
resolver 127.0.0.11 valid=30s ipv6=off;

# =============================================================================
# HTTP SERVER (Port 80)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost shop.example.com;

    # Phục vụ xác thực Let's Encrypt Certbot ACME Challenge (khi setup SSL Production)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Trong môi trường production thực tế, tự động redirect toàn bộ HTTP sang HTTPS:
    # return 301 https://$host$request_uri;

    # Cấu hình fallback cho môi trường Development/Staging chưa có chứng chỉ SSL:
    include /etc/nginx/conf.d/goshop-locations.inc;
}


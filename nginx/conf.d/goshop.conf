# DEV variant: the monolith API ("api" binary) runs on the host in dev-host mode.
# PROD overrides this file via docker-compose.prod.yml:
#   ./nginx/prod/goshop.conf:/etc/nginx/conf.d/goshop.conf:ro
upstream goshop_backend {
    server host.docker.internal:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name localhost shop.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    include /etc/nginx/conf.d/goshop-locations.inc;
}

# PROD variant: two api replicas behind least_conn. Mounted over the dev
# nginx/conf.d/goshop.conf by docker-compose.prod.yml.
upstream goshop_backend {
    least_conn;
    server api1:8080 max_fails=3 fail_timeout=10s;
    server api2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    # Local/self-managed TLS. Chrome HTTPS-First upgrades typed localhost
    # URLs and any fetch from an https origin; without a listener the
    # upgraded attempts die with ERR_ALPN_NEGOTIATION_FAILED. Swap these
    # paths to the certbot mount on a real domain.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/ssl/local.crt;
    ssl_certificate_key /etc/nginx/ssl/local.key;
    server_name localhost shop.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    include /etc/nginx/conf.d/goshop-locations.inc;
}

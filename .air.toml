# Working directory
root = "."
tmp_dir = "tmp"

[build]
    cmd = "go build -o ./tmp/main ./cmd/api"
    bin = "tmp/main"
    include_ext = ["go", "yaml", "yml", "env"]
    exclude_dir = ["assets", "tmp", "vendor", "frontend/node_modules", "bin", ".git"]
    exclude_file = []
    exclude_regex = ["_test.go"]
    delay = 1000
    send_interrupt = true
    kill_delay = 500
    poll = true
    poll_interval = 500
    log = "build.log"

[log]
    time = true

[color]
    main = "magenta"
    watcher = "cyan"
    build = "yellow"
    runner = "green"

[misc]
    clean_on_exit = true
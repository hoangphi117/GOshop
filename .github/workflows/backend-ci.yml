name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - 'refactor/**'
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # Manual runs verify the image matrix without waiting for a push.
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # buf breaking compares against origin/develop, so full history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/gomod/*/go.sum

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # Without a token the action resolves the download through the
          # unauthenticated GitHub API, which rate-limits shared runner IPs and
          # fails the job before buf ever runs.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf lint
        run: buf lint
        working-directory: backend

      - name: Gofmt check
        # Formatting is a hard gate: an unformatted file fails CI instead of
        # drifting until a bulk reformat hides real changes in noise.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: backend

      - name: Buf breaking check
        # Both sides as git refs: identical file keying regardless of whether
        # develop has backend/buf.yaml yet. buf defaults to FILE breaking
        # rules here, matching backend/buf.yaml. Runs from the repo root
        # (overrides the job's backend default) so buf finds .git directly;
        # subdir points at the workspace, whose modules now live under gomod/.
        working-directory: .
        run: buf breaking ".git#ref=HEAD,subdir=backend" --against ".git#ref=origin/develop,subdir=backend"

      - name: Go Vet
        # The workspace root is not a module, so ./... has to run per module.
        run: |
          set -e
          for module in shared contracts services cmd; do
            (cd "gomod/$module" && go vet ./...)
          done

      - name: Run Tests with Race Detector
        # Coverage is printed but does not gate: the total stays visible in
        # the log so a drop is noticed without blocking unrelated work.
        run: |
          set -e
          for module in shared contracts services cmd; do
            (cd "gomod/$module" && go test -race -coverprofile=coverage.out ./...)
          done
          go tool cover -func=gomod/shared/coverage.out | tail -1

      - name: Run golangci-lint
        # The action runs one golangci-lint process against one directory, and
        # backend/ is a workspace root with no module of its own, so lint runs
        # per module the same way vet and tests do. Each module discovers
        # backend/.golangci.yml by walking up, exactly like the local runs.
        run: |
          set -e
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          for module in shared contracts services cmd; do
            (cd "gomod/$module" && golangci-lint run --timeout=10m)
          done

  compose:
    name: Compose config smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build-only env placeholders
        # `docker compose config` interpolates `${VAR:?}` guards. This job only
        # validates file structure, so the committed example variant (no real
        # secrets) proves interpolation works end to end.
        run: cp backend/.env.prod.example backend/.env

      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml --env-file ./backend/.env config --quiet

      - name: Validate dev compose
        run: docker compose -f docker-compose.dev.yml --env-file ./backend/.env config --quiet

  images:
    # Publish per-service images from the shared build/Dockerfile.service
    # template on the long-lived branches; one OCI image per cmd/ service per
    # commit is what makes them independently deployable later (Helm/ArgoCD).
    # Feature branches skip the matrix: PRs already compile and test every
    # service, and the template itself is exercised by every develop build.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - analytics
          - api
          - banner
          - cart
          - catalog
          - chat
          - coupon
          - identity
          - inventory
          - media
          - notification
          - order
          - payment
          - review
          - worker
          - ws-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase image repository
        # GHCR image paths must be lowercase; github.repository keeps the
        # original casing of the repo name.
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/build/Dockerfile.service
          build-args: SERVICE=${{ matrix.service }}
          # Layer cache is scoped per service: the go mod download layer is
          # shared by construction, while each service's final `go build` layer
          # only reruns when the backend tree actually changed.
          cache-from: type=gha,scope=image-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.service }}
          # Only branch pushes publish; workflow_dispatch runs verify the
          # template without touching the registry.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  integration:
    name: Integration smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: super@password
          # Maintenance database: services own their own shopping_* databases.
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      kafka:
        image: apache/kafka:3.9.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
          CLUSTER_ID: goshop-ci-kafka-0000000001
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/gomod/*/go.sum

      - name: Run integration smoke tests
        run: go test -tags=integration -v ./gomod/cmd/integration

      - name: Run payment settlement integration tests
        run: go test -race -tags=integration -v ./gomod/services/payment/integrationtest
